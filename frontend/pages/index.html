<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTXH DUT</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<!-- Navbar -->
<header>
    <div class="nav-container">
        <div class="logo">CTXHDUT</div>

        <nav class="nav-link">
            <a href="#">Trang chủ</a>
            <a href="#">Tin tức</a>
            <a href="#">Hoạt động</a>
            <a href="#">Thành viên</a>
        </nav>

        <div class="nav-right">
            <input type="text" placeholder="Tìm kiếm">
            <button class="login">Đăng Nhập</button>
            <button class="signup">Đăng Ký</button>
        </div>
    </div>
</header>


<!-- Hero -->
<section class="hero">

    <div class="hero-content">

        <span class="tag">CLB Công tác xã hội DUT</span>

        <h1>
            Kết nối Cộng đồng,<br>
            <span>Lan tỏa Yêu thương</span>
        </h1>

        <p>
            Câu lạc bộ Công tác Xã hội DUT - nơi các bạn sinh viên cùng nhau tạo ra
            những giá trị tích cực thông qua các hoạt động thiện nguyện đầy ý nghĩa.
        </p>

        <div class="hero-buttons">
            <button class="btn-primary">Tham gia ngay</button>
            <button class="btn-outline">Xem hoạt động</button>
        </div>

    </div>

</section>

</body>
</html>
